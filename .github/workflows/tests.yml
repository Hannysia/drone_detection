name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-kaggle.txt

      - name: Install CPU PyTorch
        run: >
          python -m pip install torch torchvision
          -c requirements-kaggle.txt
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt -c requirements-kaggle.txt

      - name: Run tests
        env:
          LOCAL_BASE_DIR: ${{ runner.temp }}/data
          EXTRACTED_DATA_PATH: ${{ runner.temp }}/data/extracted
          EMBEDDINGS_DIR: ${{ runner.temp }}/data/embeddings
          LABELS_DIR: ${{ runner.temp }}/data/labels
          MPLBACKEND: Agg
          HF_HUB_OFFLINE: "1"
        run: python -m pytest -q