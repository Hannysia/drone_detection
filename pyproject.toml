[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone_classification"
version = "0.1.0"
description = "Latency-driven model and tracker selection for UAV interception: A system design study"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Anna Knysh" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["python-dotenv>=1.2,<2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
data = [
    "numpy>=2,<2.6",
    "pandas",
    "opencv-python",
    "Pillow",
    "ImageHash",
    "scikit-learn",
    "PyYAML",
    "tqdm",
    "huggingface-hub",
    "requests",
]
analysis = ["matplotlib", "seaborn", "plotly", "ipython"]
ml = [
    "torch>=2.6",
    "torchvision",
    "ultralytics",
    "accelerate",
    "transformers",
    "boxmot",
    "trackeval",
    "loguru",
]
classifier = ["google-genai", "Pillow"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]